# nginx site for the movies1 frontend, served from the Delhi VPS instead of
# Vercel. Replaces vercel.json: SPA fallback + the /sitemap.xml proxy + the
# content-type/cache headers. cloudflared (anchor-delhi tunnel) sends the apex
# and www here, so this only needs to listen on localhost.
#
#   install: copy to /etc/nginx/sites-available/movies1-frontend
#            ln -s ../sites-available/movies1-frontend /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
server {
    listen 127.0.0.1:8080;
    server_name 1anchormovies.buzz www.1anchormovies.buzz;

    root /opt/movies1-frontend/dist;      # the vite build output
    index index.html;

    # Hashed build assets (app.<hash>.js/css) never change — cache hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # sitemap.xml is generated by the backend (was a Vercel rewrite). Proxy it
    # to the local backend; adjust the port if yours differs (4000 is the dev
    # port). Use https://api.1anchormovies.buzz if the backend isn't local.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/sitemap.xml;
        proxy_set_header Host api.1anchormovies.buzz;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /atom.xml  { default_type "application/xml; charset=utf-8"; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /robots.txt { default_type "text/plain; charset=utf-8"; try_files $uri =404; }

    # index.html must not be cached, so a new build shows up immediately
    # (the hashed assets it points to are what get the long cache above).
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA: every non-file route serves the app shell.
    location / { try_files $uri $uri/ /index.html; }
}
